# Publishes the package to npm with a provenance statement, from GitHub Actions only.
#
# n8n verifies community nodes only when they are published from GitHub Actions with npm provenance
# (required since May 1 2026). Provenance lets anyone check that the package on npm was built by this
# workflow, from this repository and commit.
#
# No token: npm's trusted publishing (OIDC). The package's settings on npmjs.com name this repository
# and this workflow file as its trusted publisher (allowed action: npm publish), so a publish from
# anywhere else is refused and nothing secret is kept in GitHub. Provenance comes with it.
#
# Releasing:
#   1. Bump "version" in package.json and add the version to CHANGELOG.md; commit.
#   2. Tag it v<version> (git tag v0.1.0 && git push origin v0.1.0), or publish a GitHub release
#      with that tag. Either starts this workflow; a version already on npm is skipped, so a tag
#      push followed by a release of the same tag publishes once.

name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

# a release and its tag push run one after the other, never side by side
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # mints the OIDC token npm signs the provenance statement with
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # trusted publishing needs npm 11.5.1 or newer
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check the tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          # v0.1.0 from a tag push; a release made by `npm run release` (release-it) may be tagged 0.1.0
          if [ "${TAG}" != "v${VERSION}" ] && [ "${TAG}" != "${VERSION}" ]; then
            echo "The tag ${TAG} does not match package.json version ${VERSION} (expected v${VERSION})"
            exit 1
          fi

      - name: Skip a version already on npm
        id: npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          # the package's prepublishOnly (n8n-node prerelease) refuses a publish without it
          RELEASE_MODE: 'true'
